<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>GeoSpot — Défi du jour</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <h1>GeoSpot</h1>
  <span class="subtitle">Défi du jour <span id="header-num"></span> — <span id="date-display"></span></span>
</header>

<div class="main">
  <svg id="map-svg"></svg>

  <!-- Intro popup -->
  <div id="intro-overlay" class="intro-overlay hidden">
    <div class="intro-box">
      <div class="intro-challenge" id="intro-challenge"></div>
      <div class="intro-date" id="intro-date"></div>
      <div class="intro-rule">
        <svg class="intro-svg" viewBox="0 0 110 42" xmlns="http://www.w3.org/2000/svg">
          <!-- Gold guess dot on the left with label above -->
          <text x="28" y="9" text-anchor="middle" fill="#e8d06a" font-size="11" font-family="Segoe UI,system-ui,sans-serif" font-weight="700" paint-order="stroke" stroke="#111827" stroke-width="1.5">Bordeaux</text>
          <circle cx="28" cy="22" r="6" fill="#e8d06a" stroke="#a89030" stroke-width="1.5"/>
          <!-- Dashed line -->
          <line x1="36" y1="22" x2="72" y2="22" stroke="#e8d06a" stroke-width="2" stroke-dasharray="4 3"/>
          <!-- Blue target dot on the right with halo -->
          <circle cx="82" cy="22" r="10" fill="none" stroke="#7ab3e8" stroke-width="2" opacity="0.3"/>
          <circle cx="82" cy="22" r="5" fill="#7ab3e8" stroke="#3a6a9a" stroke-width="1.5"/>
        </svg>
        <p>Trouve une ville le plus proche possible de la cible.</p>

      </div>
      <button onclick="closeIntro()">Jouer</button>
    </div>
  </div>

  <!-- Celebration banner -->
  <div id="celebration-banner" class="celebration-banner hidden">
    <span id="celebration-text"></span>
  </div>

  <!-- Top-right overlay: rounds + scores -->
  <div class="guess-overlay hidden">
    <div class="overlay-header">
      <span>Round <strong id="round-current">1</strong>/5</span>
      <span>Total : <strong id="total-score">0 km</strong></span>
    </div>
    <ul id="guess-list"></ul>
    <div id="next-row" class="share-row hidden">
      <button id="next-btn" onclick="advanceRound()">Suivant →</button>
    </div>
    <div id="share-row" class="share-row hidden">
      <button id="share-btn" onclick="shareScore()">Partager</button>
    </div>
  </div>

  <!-- Bottom-center search -->
  <div class="search-wrapper hidden">
    <div id="km-flash-html" class="km-flash-html"></div>
    <div class="msg" id="msg"></div>
    <ul id="suggestions"></ul>
    <div class="search-row">
      <input id="city-input" type="text" placeholder="Trouve une ville proche..."
             autocomplete="off" spellcheck="false" />
      <button id="submit-btn" aria-label="Submit">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script src="data/france_border.js"></script>
<script src="data/cities_data.js"></script>
<script src="data/landmarks.js"></script>
<script src="js/game.js"></script>

</body>
</html>
