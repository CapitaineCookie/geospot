<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>GeoSpot — Daily Challenge</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
  <h1>GeoSpot</h1>
  <span class="subtitle">Daily challenge <span id="header-num"></span> — <span id="date-display"></span></span>
</header>

<div class="main">
  <svg id="map-svg"></svg>

  <!-- Intro popup -->
  <div id="intro-overlay" class="intro-overlay hidden">
    <div class="intro-box">
      <div class="intro-challenge" id="intro-challenge"></div>
      <div class="intro-date" id="intro-date"></div>
      <div class="intro-rule">
        <svg class="intro-svg" viewBox="0 0 100 36" xmlns="http://www.w3.org/2000/svg">
          <!-- Gold answer dot on the left, centered overall -->
          <circle cx="28" cy="20" r="6" fill="#f59e0b"/>
          <text x="28" y="8" text-anchor="middle" fill="#f59e0b" font-size="10" font-family="Segoe UI,system-ui,sans-serif" font-weight="700" paint-order="stroke" stroke="#111827" stroke-width="2">Bordeaux</text>
          <!-- Dashed line -->
          <line x1="36" y1="20" x2="64" y2="20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
          <!-- Blue mystery dot on the right -->
          <circle cx="72" cy="20" r="4" fill="none" stroke="#3b82f6" stroke-width="3"/>
        </svg>
        <p>Get as close as you can to the target.</p>

      </div>
      <button onclick="closeIntro()">Play</button>
    </div>
  </div>

  <!-- Celebration banner -->
  <div id="celebration-banner" class="celebration-banner hidden">
    <span id="celebration-text"></span>
  </div>

  <!-- Top-right overlay: rounds + scores -->
  <div class="guess-overlay hidden">
    <div class="overlay-header">
      <span>Round <strong id="round-current">1</strong>/5</span>
      <span>Total: <strong id="total-score">0 km</strong></span>
    </div>
    <ul id="guess-list"></ul>
    <div id="next-row" class="share-row hidden">
      <button id="next-btn" onclick="advanceRound()">Next round →</button>
    </div>
    <div id="share-row" class="share-row hidden">
      <button id="share-btn" onclick="shareScore()">Share your score</button>
    </div>
  </div>

  <!-- Bottom-center search -->
  <div class="search-wrapper hidden">
    <div id="km-flash-html" class="km-flash-html"></div>
    <div class="msg" id="msg"></div>
    <ul id="suggestions"></ul>
    <div class="search-row">
      <input id="city-input" type="text" placeholder="How close can you get?"
             autocomplete="off" spellcheck="false" />
      <button id="submit-btn" aria-label="Submit">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script src="data/france_border.js"></script>
<script src="data/cities_data.js"></script>
<script src="data/landmarks.js"></script>
<script src="js/game.js"></script>

</body>
</html>
