<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoSpot — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a2e; color: #eee; padding: 32px 24px; }
    h1 { color: #e94560; font-size: 1.6rem; margin-bottom: 24px; }

    /* ── Section switcher (top-level) ── */
    .section-switcher { display: flex; gap: 0; margin-bottom: 32px; border-radius: 12px; overflow: hidden; border: 1px solid #0f3460; width: fit-content; }
    .section-btn { background: #16213e; border: none; color: #aaa; padding: 12px 32px; cursor: pointer; font-size: 1rem; font-weight: 500; transition: background 0.2s, color 0.2s; }
    .section-btn:first-child { border-right: 1px solid #0f3460; }
    .section-btn:hover:not(.active) { background: #0f3460; color: #ddd; }
    .section-btn.active { background: #e94560; color: #fff; font-weight: 700; }

    .section-panel { display: none; }
    .section-panel.active { display: block; }

    /* ── Day selector ── */
    .day-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .day-selector button { background: #16213e; border: 1px solid #0f3460; color: #eee; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 0.88rem; }
    .day-selector button:hover:not(:disabled) { background: #0f3460; }
    .day-selector button:disabled { color: #444; border-color: #222; cursor: default; }
    .day-selector span { font-size: 0.92rem; color: #ccc; }

    /* ── Daily tabs ── */
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tab-btn { background: #16213e; border: 1px solid #0f3460; color: #aaa; border-radius: 8px; padding: 7px 18px; cursor: pointer; font-size: 0.9rem; }
    .tab-btn:hover { background: #0f3460; }
    .tab-btn.active { background: #3a7bd5; border-color: #3a7bd5; color: #fff; font-weight: 600; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .big-stat { font-size: 1.1rem; color: #ccc; }
    .big-stat strong { color: #fff; font-size: 1.4rem; }
    #status { color: #555; font-size: 0.78rem; margin-bottom: 16px; }

    /* ── Funnel / horizontal bar charts ── */
    .funnel { display: flex; flex-direction: column; gap: 10px; max-width: 500px; }
    .funnel-row { display: flex; align-items: center; gap: 12px; }
    .funnel-label { font-size: 0.82rem; color: #aaa; width: 90px; flex-shrink: 0; text-align: right; }
    .funnel-bar-track { flex: 1; background: #0f3460; border-radius: 6px; height: 28px; overflow: hidden; }
    .funnel-bar-fill { height: 100%; background: #3a7bd5; border-radius: 6px; display: flex; align-items: center; padding-left: 10px; font-size: 0.8rem; font-weight: 700; color: #fff; white-space: nowrap; transition: width 0.5s ease; min-width: 2px; }

    /* ── Daily players chart (vertical) ── */
    .chart-wrap { max-width: 900px; overflow-x: auto; }
    .chart-title { font-size: 0.85rem; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 18px; }
    .chart { display: flex; align-items: flex-end; gap: 6px; height: 220px; padding-bottom: 28px; position: relative; border-bottom: 1px solid #0f3460; }
    .chart-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 1; height: 100%; }
    .chart-col-bar { width: 100%; background: #3a7bd5; border-radius: 4px 4px 0 0; transition: height 0.5s ease; display: flex; align-items: flex-start; justify-content: center; padding-top: 2px; }
    .chart-col-bar span { font-size: 0.7rem; font-weight: 700; color: #fff; white-space: nowrap; }
    .chart-col-label { font-size: 0.65rem; color: #888; margin-top: 6px; text-align: center; white-space: nowrap; }
    .chart-loading { color: #555; font-size: 0.82rem; }

    /* ── Range buttons ── */
    .range-btn { background: #16213e; border: 1px solid #0f3460; color: #aaa; border-radius: 8px; padding: 6px 16px; cursor: pointer; font-size: 0.85rem; }
    .range-btn:hover:not(.active) { background: #0f3460; }
    .range-btn.active { background: #3a7bd5; border-color: #3a7bd5; color: #fff; font-weight: 600; }

    /* ── General stat cards ── */
    .stat-cards { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 36px; }
    .stat-card { background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 20px 28px; min-width: 160px; text-align: center; }
    .stat-card .label { font-size: 0.78rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; color: #fff; }

    /* ── Tables ── */
    .section { margin-top: 40px; }
    h2 { font-size: 0.85rem; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 14px; overflow: hidden; border: 1px solid #0f3460; }
    th { text-align: left; padding: 10px 16px; font-size: 0.78rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #0f3460; }
    td { padding: 10px 16px; font-size: 0.88rem; border-bottom: 1px solid #0f3460; }
    tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>

<h1>Dashboard</h1>

<!-- Top-level section switcher -->
<div class="section-switcher">
  <button class="section-btn active" data-section="general">Vue générale</button>
  <button class="section-btn" data-section="daily">Vue journalière</button>
</div>

<!-- ══ GENERAL SECTION ══════════════════════════════════════════════════════ -->
<div id="section-general" class="section-panel active">

  <div style="display:flex;gap:6px;margin-bottom:24px">
    <button class="range-btn active" data-range="7">Semaine</button>
    <button class="range-btn" data-range="30">Mois</button>
    <button class="range-btn" data-range="0">Tout</button>
  </div>

  <div class="stat-cards">
    <div class="stat-card">
      <div class="label">Total parties</div>
      <div class="value" id="gen-total-plays">—</div>
    </div>
<div class="stat-card">
      <div class="label">Moy. / jour</div>
      <div class="value" id="gen-avg-per-day">—</div>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="chart-title">Joueurs par jour</div>
    <div class="chart" id="players-chart"><div class="chart-loading">Chargement…</div></div>
  </div>

</div>

<!-- ══ DAILY SECTION ════════════════════════════════════════════════════════ -->
<div id="section-daily" class="section-panel">

  <div class="day-selector">
    <button id="prev-btn">←</button>
    <span id="day-label"></span>
    <button id="next-btn">→</button>
  </div>

  <div class="tabs" id="daily-tabs">
    <button class="tab-btn active" data-tab="events">Events</button>
    <button class="tab-btn" data-tab="guesses">Guesses</button>
    <button class="tab-btn" data-tab="scores">Scores</button>
  </div>

  <div id="tab-events" class="tab-panel active">
    <div id="status"></div>
    <div style="border-left:3px solid #3a7bd5;padding:8px 16px;margin-bottom:32px">
      <div class="big-stat" id="big-stat"></div>
    </div>
    <div style="border-top:1px solid #0f3460;margin:10px 0;max-width:500px"></div>
    <div class="funnel" id="funnel"></div>
  </div>

  <div id="tab-guesses" class="tab-panel">
    <div class="tabs" style="margin-bottom:16px" id="round-tabs">
      <button class="tab-btn active" data-round="1">R1</button>
      <button class="tab-btn" data-round="2">R2</button>
      <button class="tab-btn" data-round="3">R3</button>
      <button class="tab-btn" data-round="4">R4</button>
      <button class="tab-btn" data-round="5">R5</button>
    </div>
    <div id="rounds-sections"></div>
  </div>

  <div id="tab-scores" class="tab-panel">
    <div id="s-status" style="color:#555;font-size:0.78rem;margin-bottom:16px"></div>
    <table id="scores-table">
      <thead><tr><th>#</th><th>Score (km)</th></tr></thead>
      <tbody id="scores-body"></tbody>
    </table>
  </div>

</div>

<script src="cities.js"></script>
<script>
  const SB_URL = 'https://njnzxcxaekvbonahaxgh.supabase.co';
  const SB_KEY = 'sb_publishable_P-hy_VtGaIT_yi1UKoEGvw_G4S1R1XU';
  const EPOCH  = new Date('2026-06-22T00:00:00');

  const today = new Date(); today.setHours(0,0,0,0);
  const todayNumber = Math.floor((today - EPOCH) / 86400000) + 1;
  let currentDay = todayNumber;

  function dayToDate(n) {
    const d = new Date(EPOCH);
    d.setDate(d.getDate() + n - 1);
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function updateDaySelector() {
    document.getElementById('day-label').textContent = 'Défi #' + currentDay + ' — ' + dayToDate(currentDay);
    document.getElementById('prev-btn').disabled = currentDay <= 1;
    document.getElementById('next-btn').disabled = currentDay >= todayNumber;
  }

  // ── Section switcher ─────────────────────────────────────────────────────

  document.querySelectorAll('.section-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.section-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('section-' + btn.dataset.section).classList.add('active');
    });
  });

  // ── Events tab ───────────────────────────────────────────────────────────

  async function fetchEvents() {
    const res = await fetch(SB_URL + '/rest/v1/events?select=event,day,created_at&order=created_at.desc&limit=5000', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    return res.json();
  }

  function count(events, event, day) {
    return events.filter(e => e.event === event && e.day === day).length;
  }

  let allEvents = [];

  function renderEvents() {
    const plays   = count(allEvents, 'play',   currentDay);
    const next1   = count(allEvents, 'next_1', currentDay);
    const next2   = count(allEvents, 'next_2', currentDay);
    const next3   = count(allEvents, 'next_3', currentDay);
    const next4   = count(allEvents, 'next_4', currentDay);
    const results = count(allEvents, 'result', currentDay);
    const shares  = count(allEvents, 'share',  currentDay);

    document.getElementById('big-stat').innerHTML = 'Parties jouées : <strong>' + results + '</strong>';

    const mainSteps = [
      { label: 'Jouer',      n: plays },
      { label: 'Suivant R1', n: next1 },
      { label: 'Suivant R2', n: next2 },
      { label: 'Suivant R3', n: next3 },
      { label: 'Suivant R4', n: next4 },
      { label: 'Résultats',  n: results },
    ];
    const base = plays || 1;
    const sharePct = Math.round(shares / (results || 1) * 100);
    document.getElementById('funnel').innerHTML =
      mainSteps.map(s => {
        const pct = Math.round(s.n / base * 100);
        const label = s.n + (plays > 0 ? '  (' + pct + '%)' : '');
        return `<div class="funnel-row">
          <div class="funnel-label">${s.label}</div>
          <div class="funnel-bar-track">
            <div class="funnel-bar-fill" style="width:${pct}%">${s.n > 0 ? label : ''}</div>
          </div>
        </div>`;
      }).join('') +
      `<div style="border-top:1px solid #0f3460;margin:10px 0"></div>
       <div class="funnel-row">
         <div class="funnel-label" style="color:#888">Partager</div>
         <div class="funnel-bar-track">
           <div class="funnel-bar-fill" style="width:${sharePct}%;background:#5a9be8">${shares > 0 ? shares + '  (' + sharePct + '%)' : ''}</div>
         </div>
       </div>`;
  }

  // ── General section — players-per-day chart ───────────────────────────────

  let allScoreDays = [];
  let currentRange = 7;

  function renderPlayersChart() {
    const countsByDay = {};
    allScoreDays.forEach(e => {
      countsByDay[e.day] = (countsByDay[e.day] || 0) + 1;
    });

    // Build the list of days to show
    let days;
    if (currentRange === 0) {
      // Tout — every day from 1 to today
      days = Array.from({ length: todayNumber }, (_, i) => i + 1);
    } else {
      // Last N days
      const first = Math.max(1, todayNumber - currentRange + 1);
      days = Array.from({ length: todayNumber - first + 1 }, (_, i) => first + i);
    }

    const maxVal = Math.max(...days.map(d => countsByDay[d] || 0), 1);
    const totalPlays = days.reduce((s, d) => s + (countsByDay[d] || 0), 0);
    const activeDays = days.filter(d => countsByDay[d] > 0).length;
    const avgPerDay  = activeDays > 0 ? Math.round(totalPlays / activeDays) : 0;

    document.getElementById('gen-total-plays').textContent = totalPlays;
    document.getElementById('gen-avg-per-day').textContent = avgPerDay;

    const colMinWidth = days.length <= 7 ? 36 : days.length <= 30 ? 20 : 28;
    document.getElementById('players-chart').innerHTML = days.map(d => {
      const n   = countsByDay[d] || 0;
      const pct = Math.round(n / maxVal * 100);
      const labelSize = days.length <= 7 ? '0.65rem' : '0.58rem';
      return `<div class="chart-col" style="min-width:${colMinWidth}px">
        <div class="chart-col-bar" style="height:${Math.max(pct, 1)}%"><span>${n > 0 ? n : ''}</span></div>
        <div class="chart-col-label" style="font-size:${labelSize}">#${d}</div>
      </div>`;
    }).join('');
  }

  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRange = parseInt(btn.dataset.range);
      renderPlayersChart();
    });
  });

  async function fetchAllScoreDays() {
    const res = await fetch(SB_URL + '/rest/v1/scores?select=day&limit=10000', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    });
    return res.json();
  }

  async function loadEvents() {
    const data = await fetchEvents();
    if (!Array.isArray(data)) {
      document.getElementById('status').textContent = 'Erreur : ' + JSON.stringify(data);
      return;
    }
    allEvents = data;
    renderEvents();

    const scoreDays = await fetchAllScoreDays();
    if (Array.isArray(scoreDays)) { allScoreDays = scoreDays; renderPlayersChart(); }
  }

  // ── Guesses tab ──────────────────────────────────────────────────────────

  const cityByCode = new Map(CITIES_DATA.map(c => [c.code, c.nom]));
  let currentGuessData = [];
  let currentRound = 1;

  async function fetchGuesses(day) {
    const res = await fetch(
      SB_URL + '/rest/v1/guesses?select=city_code,round,distance_km&day=eq.' + day + '&limit=5000',
      { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } }
    );
    return res.json();
  }

  function renderRound() {
    const rGuesses = currentGuessData.filter(g => g.round === currentRound);
    const cityMap = {};
    rGuesses.forEach(g => {
      if (!cityMap[g.city_code]) cityMap[g.city_code] = { count: 0, totalDist: 0 };
      cityMap[g.city_code].count++;
      cityMap[g.city_code].totalDist += g.distance_km;
    });
    const sorted = Object.entries(cityMap).sort((a, b) =>
      b[1].count - a[1].count || (a[1].totalDist / a[1].count) - (b[1].totalDist / b[1].count)
    );
    const rows = sorted.map(([code, s]) =>
      `<tr><td>${cityByCode.get(code) ?? code}</td><td>${s.count}</td><td>${Math.round(s.totalDist / s.count)}</td></tr>`
    ).join('') || '<tr><td colspan="3" style="color:#555">Aucune donnée</td></tr>';

    document.querySelectorAll('#round-tabs .tab-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.round) === currentRound);
    });
    document.getElementById('rounds-sections').innerHTML = `
      <div class="section" style="margin-top:16px">
        <table>
          <thead><tr><th>Ville</th><th>Nb guesses</th><th>Distance moy. (km)</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  async function loadGuesses() {
    const guessData = await fetchGuesses(currentDay);
    if (!Array.isArray(guessData)) return;
    currentGuessData = guessData;
    currentRound = 1;
    renderRound();
  }

  // ── Scores tab ───────────────────────────────────────────────────────────

  async function fetchScores(day) {
    const res = await fetch(
      SB_URL + '/rest/v1/scores?select=score&day=eq.' + day + '&order=score.asc&limit=5000',
      { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } }
    );
    return res.json();
  }

  async function loadScores() {
    document.getElementById('s-status').textContent = '';
    const scoreData = await fetchScores(currentDay);
    if (!Array.isArray(scoreData)) {
      document.getElementById('s-status').textContent = 'Erreur : ' + JSON.stringify(scoreData);
      return;
    }
    document.getElementById('scores-body').innerHTML = scoreData.map((s, i) =>
      `<tr><td>${i + 1}</td><td>${s.score}</td></tr>`
    ).join('') || '<tr><td colspan="2" style="color:#555">Aucune donnée</td></tr>';
  }

  // ── Day navigation ───────────────────────────────────────────────────────

  let activeTab = 'events';

  function onDayChange() {
    updateDaySelector();
    if (activeTab === 'events') renderEvents();
    else if (activeTab === 'guesses') loadGuesses();
    else if (activeTab === 'scores') loadScores();
  }

  document.getElementById('prev-btn').addEventListener('click', () => { currentDay--; onDayChange(); });
  document.getElementById('next-btn').addEventListener('click', () => { currentDay++; onDayChange(); });

  document.querySelectorAll('#round-tabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { currentRound = parseInt(btn.dataset.round); renderRound(); });
  });

  // ── Daily tabs ───────────────────────────────────────────────────────────

  document.querySelectorAll('#daily-tabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#daily-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      activeTab = btn.dataset.tab;
      if (activeTab === 'guesses') loadGuesses();
      else if (activeTab === 'scores') loadScores();
    });
  });

  // ── Init ─────────────────────────────────────────────────────────────────

  updateDaySelector();
  loadEvents();
</script>
</body>
</html>
